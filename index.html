<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trading Card Wizard</title>
    <meta
      name="description"
      content="Browser-based trading card creator for the discord memes."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div>
          <h1>Trading Card Wizard</h1>
          <p class="subtitle">Browser-based trading card creator for the discord memes.</p>
        </div>
        <div class="topbar-actions">
          <button id="savePreset" type="button">Save Preset</button>
          <button id="loadPreset" type="button">Load Preset</button>
          <button id="downloadPreset" type="button">Download JSON</button>
          <button id="uploadPresetButton" type="button">Upload JSON</button>
          <input id="uploadPresetInput" type="file" accept=".json,application/json" hidden />
        </div>
      </header>

      <main class="workspace">
        <section class="panel controls">
          <h2>Card Data</h2>

          <div class="grid two">
            <label class="wide">
              Card Type
              <select id="cardType">
                <option value="pokemon">Pokemon</option>
                <option value="trainer">Trainer</option>
                <option value="energy">Energy</option>
              </select>
            </label>
            <label data-card-modes="pokemon">
              Stage
              <input id="stage" type="text" maxlength="14" />
            </label>
            <label class="type-symbol-control" data-card-modes="pokemon energy">
              Type Symbol
              <input id="typeSymbol" type="text" maxlength="2" />
            </label>
            <label class="wide">
              Name
              <input id="cardName" type="text" maxlength="28" />
            </label>
            <label data-card-modes="pokemon">
              HP
              <div class="inline-pair">
                <input id="hpRange" type="range" min="10" max="300" />
                <input id="hpNumber" type="number" min="10" max="300" />
              </div>
            </label>
          </div>

          <h3>Art & Identity</h3>
          <div class="grid two">
            <label>
              Card Number
              <input id="cardNumber" type="text" maxlength="24" />
            </label>
            <label data-card-modes="pokemon">
              Species
              <input id="species" type="text" maxlength="26" />
            </label>
            <label data-card-modes="pokemon">
              Height
              <input id="heightText" type="text" maxlength="12" />
            </label>
            <label data-card-modes="pokemon">
              Weight
              <input id="weightText" type="text" maxlength="14" />
            </label>
            <label class="wide">
              Artwork Image
              <div class="inline-pair upload-row">
                <input id="artUpload" type="file" accept="image/*" />
                <button id="clearArt" type="button">Use Default</button>
              </div>
            </label>
            <label>
              Art Zoom
              <input id="artZoom" type="range" min="80" max="180" />
            </label>
            <label>
              Art Offset X
              <input id="artOffsetX" type="range" min="-180" max="180" />
            </label>
            <label>
              Art Offset Y
              <input id="artOffsetY" type="range" min="-180" max="180" />
            </label>
          </div>

          <h3 data-card-modes="pokemon">Attack 1</h3>
          <div class="grid two" data-card-modes="pokemon">
            <label>
              Cost Tokens
              <input id="move1Cost" type="text" maxlength="20" />
            </label>
            <label>
              Move Name
              <input id="move1Name" type="text" maxlength="24" />
            </label>
            <label class="wide">
              Move Text
              <textarea id="move1Text" rows="2" maxlength="180"></textarea>
            </label>
          </div>

          <h3 data-card-modes="pokemon">Attack 2</h3>
          <div class="grid two" data-card-modes="pokemon">
            <label>
              Cost Tokens
              <input id="move2Cost" type="text" maxlength="20" />
            </label>
            <label>
              Move Name
              <input id="move2Name" type="text" maxlength="24" />
            </label>
            <label>
              Damage
              <div class="inline-pair">
                <input id="move2DamageRange" type="range" min="0" max="300" />
                <input id="move2Damage" type="number" min="0" max="300" />
              </div>
            </label>
            <label class="wide">
              Move Text
              <textarea id="move2Text" rows="2" maxlength="180"></textarea>
            </label>
          </div>

          <h3 data-card-modes="trainer">Trainer Card</h3>
          <div class="grid two" data-card-modes="trainer">
            <label>
              Trainer Banner
              <input id="trainerTag" type="text" maxlength="16" />
            </label>
            <label>
              Trainer Class
              <select id="trainerCategory">
                <option value="item">Item</option>
                <option value="supporter">Supporter</option>
                <option value="stadium">Stadium</option>
                <option value="tool">Pokemon Tool</option>
              </select>
            </label>
            <label class="wide">
              Effect Text
              <textarea id="trainerEffect" rows="4" maxlength="520"></textarea>
            </label>
          </div>

          <h3 data-card-modes="energy">Energy Card</h3>
          <div class="grid two" data-card-modes="energy">
            <label>
              Energy Subtype
              <select id="energySubtype">
                <option value="basic">Basic</option>
                <option value="special">Special</option>
              </select>
            </label>
            <label class="wide">
              Effect Text
              <textarea id="energyEffect" rows="4" maxlength="420"></textarea>
            </label>
          </div>

          <h3>Footer</h3>
          <div class="grid two">
            <label data-card-modes="pokemon">
              Weakness
              <input id="weakness" type="text" maxlength="18" />
            </label>
            <label data-card-modes="pokemon">
              Resistance
              <input id="resistance" type="text" maxlength="18" />
            </label>
            <label data-card-modes="pokemon">
              Retreat
              <input id="retreat" type="text" maxlength="18" />
            </label>
            <label>
              Year
              <input id="yearText" type="text" maxlength="6" />
            </label>
            <label class="wide" data-card-modes="pokemon">
              Flavor Ribbon Text
              <textarea id="flavorText" rows="2" maxlength="160"></textarea>
            </label>
            <label>
              Illustrator
              <input id="illustrator" type="text" maxlength="40" />
            </label>
            <label>
              Collector Number
              <input id="collectorNumber" type="text" maxlength="12" />
            </label>
          </div>

          <h3>Text Labels</h3>
          <div class="grid two">
            <label data-card-modes="pokemon">
              HP Label
              <input id="hpLabel" type="text" maxlength="8" />
            </label>
            <label>
              Illustrator Label
              <input id="illustratorLabel" type="text" maxlength="12" />
            </label>
            <label data-card-modes="pokemon">
              Weakness Label
              <input id="weaknessLabel" type="text" maxlength="18" />
            </label>
            <label data-card-modes="pokemon">
              Resistance Label
              <input id="resistanceLabel" type="text" maxlength="18" />
            </label>
            <label data-card-modes="pokemon">
              Retreat Label
              <input id="retreatLabel" type="text" maxlength="18" />
            </label>
            <label>
              Set Symbol
              <input id="setSymbol" type="text" maxlength="3" />
            </label>
            <label class="wide" data-card-modes="pokemon">
              Info Line (override)
              <input id="infoLine" type="text" maxlength="120" />
            </label>
            <label class="wide">
              Copyright Text
              <input id="copyrightText" type="text" maxlength="42" />
            </label>
          </div>

          <h3>Visual Tuning</h3>
          <div class="grid two">
            <label class="wide">
              Card Theme
              <select id="cardTheme">
                <option value="electric">Electric Gold</option>
                <option value="ember">Ember Red</option>
                <option value="tidal">Tidal Blue</option>
                <option value="grove">Grove Green</option>
                <option value="violet">Violet Arcane</option>
              </select>
            </label>
            <label>
              Hue Shift
              <input id="hueShift" type="range" min="-35" max="35" />
            </label>
            <label>
              Saturation
              <input id="saturation" type="range" min="60" max="150" />
            </label>
            <label>
              Texture Intensity
              <input id="texture" type="range" min="0" max="100" />
            </label>
            <label>
              Corner Radius
              <input id="cornerRadius" type="range" min="20" max="56" />
            </label>
            <label>
              Export Scale
              <select id="exportScale">
                <option value="2">2x</option>
                <option value="3">3x</option>
                <option value="4">4x</option>
                <option value="5">5x</option>
              </select>
            </label>
          </div>

          <h3>Precision Tuning</h3>
          <div class="grid two">
            <label>
              Header Offset X
              <input id="headerOffsetX" type="range" min="-20" max="20" />
            </label>
            <label>
              Header Offset Y
              <input id="headerOffsetY" type="range" min="-20" max="20" />
            </label>
            <label>
              Name Offset X
              <input id="nameOffsetX" type="range" min="-40" max="40" />
            </label>
            <label>
              Name Offset Y
              <input id="nameOffsetY" type="range" min="-24" max="24" />
            </label>
            <label>
              Name Size Adjust
              <input id="nameSizeAdjust" type="range" min="-12" max="12" />
            </label>
            <label>
              Name Tracking
              <input id="nameTracking" type="range" min="-4" max="6" />
            </label>
            <label data-card-modes="pokemon">
              HP Offset X
              <input id="hpOffsetX" type="range" min="-24" max="24" />
            </label>
            <label data-card-modes="pokemon">
              HP Offset Y
              <input id="hpOffsetY" type="range" min="-24" max="24" />
            </label>
            <label data-card-modes="pokemon">
              HP Size Adjust
              <input id="hpSizeAdjust" type="range" min="-12" max="12" />
            </label>
            <label data-card-modes="pokemon">
              Stage Offset X
              <input id="stageOffsetX" type="range" min="-20" max="20" />
            </label>
            <label data-card-modes="pokemon">
              Stage Offset Y
              <input id="stageOffsetY" type="range" min="-20" max="20" />
            </label>
            <label data-card-modes="pokemon">
              Stage Size Adjust
              <input id="stageSizeAdjust" type="range" min="-10" max="10" />
            </label>
            <label>
              Art Frame Offset Y
              <input id="artFrameOffsetY" type="range" min="-30" max="30" />
            </label>
            <label data-card-modes="pokemon">
              Info Strip Offset Y
              <input id="infoStripOffsetY" type="range" min="-20" max="20" />
            </label>
            <label data-card-modes="pokemon">
              Attack Block Offset Y
              <input id="attackOffsetY" type="range" min="-40" max="40" />
            </label>
            <label data-card-modes="pokemon">
              Move Name Size Adjust
              <input id="moveNameSizeAdjust" type="range" min="-10" max="10" />
            </label>
            <label data-card-modes="pokemon">
              Move Text Size Adjust
              <input id="moveTextSizeAdjust" type="range" min="-8" max="8" />
            </label>
            <label data-card-modes="pokemon">
              Move Text Leading
              <input id="moveTextLeadingAdjust" type="range" min="-8" max="8" />
            </label>
            <label>
              Footer Offset Y
              <input id="footerOffsetY" type="range" min="-40" max="40" />
            </label>
            <label data-card-modes="pokemon">
              Flavor Text Size
              <input id="flavorSizeAdjust" type="range" min="-8" max="8" />
            </label>
          </div>
        </section>

        <section class="panel preview">
          <h2>Live Preview</h2>
          <div class="preview-frame">
            <canvas
              id="cardCanvas"
              width="734"
              height="1024"
              role="img"
              aria-label="Trading card preview"
            ></canvas>
          </div>
          <div class="preview-actions">
            <button id="exportPng" type="button">Export PNG</button>
            <button id="exportJpg" type="button">Export JPEG</button>
            <button id="resetCard" type="button">Reset to Default</button>
          </div>
          <p id="statusMessage" class="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
